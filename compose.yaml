services:
  app:
    image: ghcr.io/stefanwalther/ghn:latest
    build: .
    ports:
      - "${PORT:-21120}:21120"
    env_file:
      - .env
    environment:
      # Pinned: the container always listens on 21120. The host side is
      # mapped via ${PORT} above, so a PORT override in .env or the shell
      # cannot break the container's listen port. environment wins over
      # env_file here on purpose.
      - PORT=21120
      # Pinned: local default is ~/.local/share/ghn/ghn.db, container
      # persists via the ghn-data volume instead.
      - GHN_DB_PATH=/app/data/ghn.db
    volumes:
      - ghn-data:/app/data

volumes:
  ghn-data:
